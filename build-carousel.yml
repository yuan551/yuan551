name: Build tech carousel

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - scripts/build_carousel.py
      - .github/workflows/build-carousel.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the carousel SVG
        run: python scripts/build_carousel.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tech-carousel.svg
          git diff --cached --quiet || git commit -m "Update tech carousel"
          git push
